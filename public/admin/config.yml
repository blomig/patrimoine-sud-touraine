# Interface Sveltia CMS. Les libellés sont en français.
# Aucun proxy OAuth n'est branché : la connexion se fait avec un jeton personnel.
# Voir le README, section Administration.
backend:
  name: github
  repo: blomig/patrimoine-sud-touraine
  branch: main
locale: fr
site_url: https://blomig.github.io/patrimoine-sud-touraine
display_url: https://blomig.github.io/patrimoine-sud-touraine
media_folder: public/media
public_folder: /patrimoine-sud-touraine/media
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"
collections:
  - name: batiments-anciens-disparus
    label: Bâtiments disparus
    label_singular: Bâtiment disparu
    folder: contenu/batiments-anciens-disparus
    create: true
    extension: md
    format: frontmatter
    identifier_field: titre
    slug: "{{fields.id}}"
    summary: "{{titre}} — {{commune}}"
    fields:
      - label: Catégorie
        name: categorie
        widget: hidden
        default: batiments-anciens-disparus

      - label: Identifiant
        name: id
        widget: string
        hint: Minuscules et tirets, sans accent. Sert de nom de fichier.
        pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Utilisez seulement des minuscules, des chiffres et des tirets."]
      - label: Titre
        name: titre
        widget: string
      - label: Thèmes
        name: themes
        widget: list
        hint: Identifiants présents dans themes.yml. Un identifiant inconnu n'empêche pas la construction du site.
        field:
          label: Thème
          name: theme
          widget: string
      - label: Commune
        name: commune
        widget: string
      - label: Code INSEE
        name: insee
        widget: string
      - label: Latitude
        name: latitude
        widget: number
        value_type: float
        required: false
      - label: Longitude
        name: longitude
        widget: number
        value_type: float
        required: false
      - label: Période
        name: periode
        widget: string
      - label: Date de début
        name: date_debut
        widget: string
        required: false
        hint: "Année (973 ou -2400), année et mois (1429-05) ou date complète (2026-12-12). Laisser vide si inconnue."
      - label: Date de fin
        name: date_fin
        widget: string
        required: false
      - label: Notice Mérimée
        name: merimee
        widget: string
        required: false
      - label: Statut
        name: statut
        widget: select
        options:
          - "à vérifier"
          - "validé"
        default: "à vérifier"
      - label: Sources
        name: sources
        widget: list
        fields:
          - label: Titre
            name: titre
            widget: string
          - label: Adresse web
            name: url
            widget: string
      - label: Image
        name: image
        widget: object
        required: false
        hint: Une seule image, libre de droits. Laisser vide s'il n'y en a pas.
        fields:
          - label: Adresse du fichier
            name: url
            widget: string
          - label: Page Wikimedia Commons
            name: page_commons
            widget: string
            required: false
          - label: Licence
            name: licence
            widget: string
          - label: Auteur
            name: auteur
            widget: string
      - label: Texte
        name: body
        widget: markdown

