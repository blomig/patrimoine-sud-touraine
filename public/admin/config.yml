  - name: reglages
    label: Réglages et listes
    files:
      - label: Design publié
        name: site
        file: contenu/site.yml
        fields:
          - label: Titre du site
            name: titre
            widget: string
          - label: Sous-titre
            name: sous_titre
            widget: string
            hint: "Garder {n} : il est remplacé à chaque construction par le nombre de fiches (hors agenda). Ne pas écrire le nombre à la main."
          - label: Design
            name: design
            widget: select
            hint: Le seul réglage de l'apparence publiée. Comparer les six sur la page Designs.
            options:
              - label: Revue savante
                value: revue
              - label: Carnet de voyage
                value: carnet
              - label: Musée
                value: musee
              - label: Contemporain
                value: contemporain
              - label: Minimal
                value: minimal
              - label: Revue marine
                value: revue-marine
      - label: Illustrations des rubriques
        name: categories
        file: contenu/categories.yml
        fields:
          - label: Rubriques
            name: categories
            widget: object
            fields:
              - label: Bâtiments disparus
                name: batiments-anciens-disparus
                widget: object
                fields: &image_rubrique
                  - label: Nom affiché
                    name: titre
                    widget: string
                    required: false
                    hint: "Si ce champ est rempli, il remplace le libellé du menu et des pages. C'est ici que l'on renomme Vie économique."
                  - label: Légende
                    name: legende
                    widget: string
                  - label: Fichier dans le dépôt
                    name: fichier
                    widget: string
                    required: false
                    hint: Par exemple /media/categories/photo.jpg. Laisser vide pour afficher directement l'adresse ci-dessous.
                  - label: Page Wikimedia Commons
                    name: url
                    widget: string
                    required: false
                    hint: Laisser vide pour une photo de la collection, sans lien Commons.
                  - label: Auteur
                    name: auteur
                    widget: string
                  - label: Licence
                    name: licence
                    widget: string
                    required: false
                    hint: Par exemple CC BY-SA 4.0 ou Domaine public. Vide pour une photo de la collection.
              - label: Bâtiments existants
                name: batiments-anciens-existants
                widget: object
                fields: *image_rubrique
              - label: Personnages
                name: personnes
                widget: object
                fields: *image_rubrique
              - label: Événements historiques
                name: evenements-historiques
                widget: object
                fields: *image_rubrique
              - label: Animations
                name: agenda
                widget: object
                fields: *image_rubrique
              - label: Vie économique
                name: vie-economique
                widget: object
                fields: *image_rubrique
              - label: Documents
                name: documents
                widget: object
                fields: *image_rubrique
      - label: Thèmes
        name: themes
        file: contenu/themes.yml
        fields:
          - label: Catégories
            name: categories
            widget: object
            fields:
            - label: Bâtiments disparus
              name: batiments-anciens-disparus
              widget: object
              fields:
                - label: Libellé de la rubrique
                  name: libelle
                  widget: string
                - label: Thèmes
                  name: themes
                  widget: list
                  summary: "{{libelle}}"
                  fields:
                    - label: Identifiant
                      name: id
                      widget: string
                      hint: Minuscules et tirets. Le changer casse le lien avec les fiches qui l'utilisent déjà ; pour renommer, modifiez seulement le libellé.
                    - label: Libellé
                      name: libelle
                      widget: string
            - label: Bâtiments existants
              name: batiments-anciens-existants
              widget: object
              fields:
                - label: Libellé de la rubrique
                  name: libelle
                  widget: string
                - label: Thèmes
                  name: themes
                  widget: list
                  summary: "{{libelle}}"
                  fields:
                    - label: Identifiant
                      name: id
                      widget: string
                      hint: Minuscules et tirets. Le changer casse le lien avec les fiches qui l'utilisent déjà ; pour renommer, modifiez seulement le libellé.
                    - label: Libellé
                      name: libelle
                      widget: string
            - label: Personnages
              name: personnes
              widget: object
              fields:
