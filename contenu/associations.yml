# Annuaire des associations patrimoniales repérées sur le territoire de la CCLST.
# Les sites officiels n'ont pas tous été identifiés ; les champs vides sont volontairement
# laissés à null plutôt que devinés. Statut : à vérifier.

associations:
  - id: mpl-ligueil
    nom: Mémoire et Patrimoine en Ligueillois (MPL)
    commune: Ligueil
    insee: "37130"
    site: "https://memoire-patrimoine-ligueillois.fr/"
    notes: >
      Association présentée par valleedelariolle.fr comme créée il y a près de 50 ans
      autour du docteur Delaune, à Ligueil. Le même site lui attribue l'idée de
      ne pas laisser détruire les matériels de la laiterie après sa fermeture, et
      la restauration d'un lavoir près de La Chapelle-Blanche-Saint-Martin. Une
      fiche associative (net1901.org) mentionne un objet d'étude, collecte,
      protection, valorisation et sauvegarde du patrimoine, avec une date
      associée au 14 septembre 1978. Le 17 mai 2025, l'association a organisé
      à Grillemont une journée de découverte comprenant la première visite
      commentée d'une collection de matériels agricoles anciens présentée dans
      une grange de la propriété, ainsi qu'une visite du château. Un site
      officiel est désormais indiqué par le blog : https://memoire-patrimoine-ligueillois.fr/
      (adresse postale indiquée : Mairie de Ligueil, 37240).
    sources:
      - https://valleedelariolle.fr/a-la-chapelle-blanche-journee-de-decouverte-proposee-par-mpl/
      - https://www.net1901.org/association/MEMOIRE-ET-PATRIMOINE-EN-LIGUEILLOIS,2440981.html
      - https://memoire-patrimoine-ligueillois.fr/

  - id: amis-du-pays-lochois
    nom: Amis du Pays Lochois
    commune: Loches
    insee: "37132"
    site: null
    notes: >
      Association déclarée à Loches, date d'apparition indiquée au 15 septembre 1947
      (identifiant WALDEC/RNA W373001970). Objet rapporté : recherche, étude,
      conservation, reproduction, protection et mise en valeur de documents,
      monuments et sites se rattachant au pays lochois. Site officiel non identifié.
    sources:
      - https://www.assoce.fr/waldec/W373001970/AMIS-DU-PAYS-LOCHOIS

  - id: foulques-nerra-amis-de-montresor
    nom: Association internationale Foulques Nerra – Les Amis de Montrésor
    commune: Montrésor
    insee: "37157"
    site: null
    notes: >
      Association loi 1901 recensée à Montrésor (fiche net1901.org). Site officiel
      non identifié lors de la collecte.
    sources:
      - https://www.net1901.org/association/ASSOCIATION-INTERNATIONALE-FOULQUES-NERRA-LES-AMIS-DE-MONTRESOR,1905863.html

  - id: amis-musee-prehistoire-grand-pressigny
    nom: Association des Amis du Musée de Préhistoire du Grand-Pressigny
    commune: Le Grand-Pressigny
    insee: "37113"
    site: null
    notes: >
      Association liée au musée de la Préhistoire du Grand-Pressigny (établissement
      dont le site est https://www.prehistoiregrandpressigny.fr/). Fiche associative
      sur net1901.org. Le site propre de l'association n'a pas été distingué de
      celui du musée.
    sources:
      - https://www.net1901.org/association/ASSOCIATION-DES-AMIS-DU-MUSEE-DE-PREHISTOIRE-DU-GRAND-PRESSIGNY,1001032621.html
      - https://www.prehistoiregrandpressigny.fr/

  - id: societe-archeologique-preuilly
    nom: Société archéologique de Preuilly-sur-Claise
    commune: Preuilly-sur-Claise
    insee: "37189"
    site: null
    notes: >
      Existence confirmée par un article de La Nouvelle République daté du
      4 novembre 2025, évoquant le bilan de l'association et ses projets vers 2026.
      Le contenu de l'article n'a pas été recopié (titre et lien seulement).
      Site officiel non identifié.
    sources:
      - https://www.lanouvellerepublique.fr/indre-et-loire/commune/preuilly-sur-claise/la-societe-archeologique-de-preuilly-sur-claise-dresse-le-bilan-et-se-projette-vers-2026-1762279805

  - id: societe-archeologique-de-touraine
    nom: Société archéologique de Touraine
    commune: Tours
    insee: "37261"
    site: https://www.societe-archeologique-touraine.fr/
    notes: >
      Société savante historique dont le siège est à Tours, donc hors CCLST, mais
      dont les travaux et publications concernent souvent le Sud Touraine
      (Loches, Riolle, etc.). À n'inscrire dans l'annuaire « local » qu'avec
      un libellé clair, pour ne pas laisser croire qu'il s'agit d'une association
      de la communauté de communes.
    sources:
      - https://www.societe-archeologique-touraine.fr/

  - id: amis-eglise-patrimoine-bournan
    nom: Les Amis de l'église et du patrimoine de Bournan
    commune: Bournan
    insee: "37032"
    site: null
    notes: >
      Association nommée dans un article de La Renaissance Lochoise publié le
      24 septembre 2026, à propos de l'ouverture de l'église Saint-Martin lors
      des 43es Journées européennes du patrimoine. Le texte de l'article n'a
      pas été recopié (titre, commune et lien seulement). Site officiel non
      identifié lors de la collecte.
    sources:
      - https://www.renaissancelochoise.com/actualite-7578-bournan-une-eglise-millenaire-a-sauver

  - id: betz-stioles-et-cie
    nom: Betz-Stioles & Cie (également écrite Betz-Stioles et Compagnie)
    commune: Betz-le-Château
    insee: "37026"
    site: null
    notes: >
      Association mentionnée par La Renaissance Lochoise pour une balade-visite
      à Betz-le-Château (vendredi 11 septembre 2026) et pour une rencontre sur
      l'alimentation néolithique (31 octobre 2026 à 18 h 30, salle des fêtes),
      avec Guillaume Parpaite-Larguier, archéologue et médiateur scientifique
      au musée de la Préhistoire du Grand-Pressigny. Un article la dit
      « chère à Joël Joubert ». Le contenu des articles n'a pas été recopié.
      Site officiel non identifié lors de la collecte.
    sources:
      - https://www.renaissancelochoise.com/actualite-7592-betz-le-chateau-betz-se-balade-avec-betz-stioles-cie
      - https://www.renaissancelochoise.com/actualite-7732-betz-le-chateau-betz-stioles-cie-evoque-l-alimentation-neolithique
