      non identifié lors de la collecte.
    sources:
      - https://www.net1901.org/association/ASSOCIATION-INTERNATIONALE-FOULQUES-NERRA-LES-AMIS-DE-MONTRESOR,1905863.html

  - id: amis-musee-prehistoire-grand-pressigny
    nom: Association des Amis du Musée de Préhistoire du Grand-Pressigny
    commune: Le Grand-Pressigny
    insee: "37113"
    site: null
    notes: >
      Association liée au musée de la Préhistoire du Grand-Pressigny (établissement
